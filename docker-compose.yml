version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: govflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: govflow_dev
      POSTGRES_USER: govflow
      POSTGRES_PASSWORD: govflow_secret
    ports:
      - "5460:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
